# FutureSchool High School Management System Configuration
server.port=5000

# PostgreSQL 17 Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/futureschool
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=FutureschoolSecretKeyForJwtTokenGenerationSecurityMustBe256BitsLongAtLeast123456
jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001
