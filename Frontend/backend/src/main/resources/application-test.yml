spring:
  datasource:
    url: jdbc:h2:mem:futureschool_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

logging:
  level:
    com.futureschool: INFO
    org.springframework: WARN
